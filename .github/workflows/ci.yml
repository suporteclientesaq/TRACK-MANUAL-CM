name: Verificação do Track Manual
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TRACK_WHATSAPP_AUTO_RECONNECT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configurar diretório temporário
        run: echo "TRACK_DATA_DIR=$RUNNER_TEMP/track-manual-ci" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
