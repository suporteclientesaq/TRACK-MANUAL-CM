services:
  waha:
    image: ${WAHA_IMAGE:?Defina a imagem oficial com tag ou digest verificado}
    restart: unless-stopped
    init: true
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Configure a chave da API do WAHA}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-WEBJS}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Configure a senha do dashboard}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Configure a senha do dashboard}
    ports:
      - "127.0.0.1:${WAHA_LOCAL_PORT:-3001}:3000"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  waha_sessions:
  waha_media:
